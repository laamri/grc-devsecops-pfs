apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: pfs-app
      containers:
        - name: auth
          image: 132415609490.dkr.ecr.eu-north-1.amazonaws.com/pfs-backend:latest
          command: ["uvicorn", "auth_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: CORS_ORIGINS
              value: "https://pfs.example.com"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pfs-app-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
