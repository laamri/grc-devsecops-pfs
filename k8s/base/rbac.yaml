apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader-sa
  namespace: pfs
automountServiceAccountToken: false

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: pfs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: pfs
subjects:
  - kind: ServiceAccount
    name: pod-reader-sa
    namespace: pfs
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io