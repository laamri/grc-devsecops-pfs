
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: pfs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]


---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: pfs
subjects:
  - kind: ServiceAccount
    name: pod-reader-sa
    namespace: pfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader



---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pfs-observers-binding
  namespace: pfs
subjects:
  - kind: Group
    name: pfs-observers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: pfs-observer
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pfs-developers-binding
  namespace: pfs
subjects:
  - kind: Group
    name: pfs-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: pfs-developer
  apiGroup: rbac.authorization.k8s.io
