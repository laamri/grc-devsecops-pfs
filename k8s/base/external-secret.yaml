apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pfs-app-secrets
  namespace: pfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: pfs-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MONGO_URI
      remoteRef:
        key: pfs/prod/app
        property: MONGO_URI
    - secretKey: JWT_SECRET
      remoteRef:
        key: pfs/prod/app
        property: JWT_SECRET
