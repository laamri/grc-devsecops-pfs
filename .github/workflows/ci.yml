name: DevSecOps PFS - CI Pipeline

on:
  push:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  security-scan:
    name: Secrets and dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect secrets with Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Scan dependencies and filesystem with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: sarif
        output: trivy-results.sarif
        exit-code: '1'

    - name: Upload security scan reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-reports
        path: |
          gitleaks-report.json
          gitleaks.sarif
          trivy-results.sarif
        if-no-files-found: ignore

  # 1. CI for Python FastAPI Microservices
  backend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Runs the job twice: once for Auth Service, once for Task Service
        service: [auth_service, task_service] 
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      # Uses a conditional check so the pipeline doesn't fail if the folders aren't created yet
      run: |
        python -m pip install --upgrade pip
        if [ -d "${{ matrix.service }}" ]; then
          cd ${{ matrix.service }}
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8
        else
          echo "Directory ${{ matrix.service }} not found yet. Skipping."
        fi

    - name: Lint and Test (FastAPI)
      run: |
        set -o pipefail
        if [ -d "${{ matrix.service }}" ]; then
          cd ${{ matrix.service }}
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest -q --junitxml="${{ github.workspace }}/${{ matrix.service }}-pytest.xml" | tee "${{ github.workspace }}/${{ matrix.service }}-pytest.log"
        fi

    - name: Upload backend test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.service }}-test-report
        path: |
          ${{ matrix.service }}-pytest.xml
          ${{ matrix.service }}-pytest.log
        if-no-files-found: error
    - name: Verify Docker Build (Backend)
      run: |
        if [ -f "${{ matrix.service }}/Dockerfile" ]; then
          cd ${{ matrix.service }}
          docker build -t pfs-${{ matrix.service }}:test .
        fi

  # 2. CI for Next.js Frontend
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json' # Adjust path if needed

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Lint and build frontend
      run: |
        set -o pipefail
        cd frontend
        npm run lint 2>&1 | tee "${{ github.workspace }}/frontend-lint.log"
        npm run build 2>&1 | tee "${{ github.workspace }}/frontend-build.log"

    - name: Upload frontend validation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-report
        path: |
          frontend-lint.log
          frontend-build.log
        if-no-files-found: error

    - name: Verify Docker Build (Frontend)
      run: |
        if [ -f "frontend/Dockerfile" ]; then
          cd frontend
          docker build -t pfs-frontend:test .
        fi
