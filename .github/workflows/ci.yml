name: DevSecOps PFS - CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 1. CI for Python FastAPI Microservices
  backend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Runs the job twice: once for Auth Service, once for Task Service
        service: [auth_service, task_service] 
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      # Uses a conditional check so the pipeline doesn't fail if the folders aren't created yet
      run: |
        python -m pip install --upgrade pip
        if [ -d "${{ matrix.service }}" ]; then
          cd ${{ matrix.service }}
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8
        else
          echo "Directory ${{ matrix.service }} not found yet. Skipping."
        fi

    - name: Lint and Test (FastAPI)
      run: |
        if [ -d "${{ matrix.service }}" ]; then
          cd ${{ matrix.service }}
          # Check for syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Run tests if a tests folder exists
          if [ -d "tests" ]; then pytest; fi
        fi

    - name: Verify Docker Build (Backend)
      run: |
        if [ -f "${{ matrix.service }}/Dockerfile" ]; then
          cd ${{ matrix.service }}
          docker build -t pfs-${{ matrix.service }}:test .
        fi

  # 2. CI for Next.js Frontend
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json' # Adjust path if needed

    - name: Install & Build (Next.js)
      run: |
        if [ -d "frontend" ]; then
          cd frontend
          npm ci
          npm run build
        else
          echo "Frontend directory not found yet. Skipping."
        fi

    - name: Verify Docker Build (Frontend)
      run: |
        if [ -f "frontend/Dockerfile" ]; then
          cd frontend
          docker build -t pfs-frontend:test .
        fi