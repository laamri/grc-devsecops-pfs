name: DevSecOps PFS - CI Pipeline

on:
  push:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Secrets and dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect secrets with Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Scan dependencies and filesystem with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        format: sarif
        output: trivy-results.sarif
        exit-code: '1'

    - name: Upload security scan reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-reports
        path: |
          gitleaks-report.json
          gitleaks.sarif
          trivy-results.sarif
        if-no-files-found: ignore

  sast-scan:
    name: SAST Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST & Quality Gate
        run: |
          semgrep scan \
            --config p/python \
            --config p/fastapi \
            --config p/typescript \
            --config p/react \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error \
            --sarif \
            --output semgrep-results.sarif \
            .

      - name: Upload Semgrep SAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-report
          path: semgrep-results.sarif
          if-no-files-found: warn
  
  
  # 1. CI for Python FastAPI Microservices
  backend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Runs the job twice: once for Auth Service, once for Task Service
        service: [auth_service, task_service] 
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      # Uses a conditional check so the pipeline doesn't fail if the folders aren't created yet
      run: |
        python -m pip install --upgrade pip
        if [ -d "${{ matrix.service }}" ]; then
          cd ${{ matrix.service }}
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8
        else
          echo "Directory ${{ matrix.service }} not found yet. Skipping."
        fi

    - name: Lint and Test (FastAPI)
      run: |
        set -o pipefail
        if [ -d "${{ matrix.service }}" ]; then
          cd ${{ matrix.service }}
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest -q --junitxml="${{ github.workspace }}/${{ matrix.service }}-pytest.xml" | tee "${{ github.workspace }}/${{ matrix.service }}-pytest.log"
        fi

    - name: Upload backend test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.service }}-test-report
        path: |
          ${{ matrix.service }}-pytest.xml
          ${{ matrix.service }}-pytest.log
        if-no-files-found: error
  # 2. CI for Next.js Frontend
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json' # Adjust path if needed

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Lint and build frontend
      run: |
        set -o pipefail
        cd frontend
        npm run lint 2>&1 | tee "${{ github.workspace }}/frontend-lint.log"
        npm run build 2>&1 | tee "${{ github.workspace }}/frontend-build.log"

    - name: Upload frontend validation report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-test-report
        path: |
          frontend-lint.log
          frontend-build.log
        if-no-files-found: error

  docker-images:
    name: Build both images after all quality gates
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, security-scan, sast-scan]
    # Default success() semantics skip this job if any required job fails/is skipped.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and frontend without AWS
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f backend/Dockerfile -t pfs-backend:ci .
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f frontend/Dockerfile -t pfs-frontend:ci frontend/

      - name: Save images for the develop publication job
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: docker save -o images.tar pfs-backend:ci pfs-frontend:ci

      - name: Upload images for this workflow run
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          # Stable across attempts so "rerun failed jobs" can reuse the build.
          name: ci-images-${{ github.run_id }}
          overwrite: true
          path: images.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish-images:
    name: Publish immutable ECR images on develop
    runs-on: ubuntu-latest
    needs: docker-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    # Serialize publishers without cancelling a run between its two image pushes.
    concurrency:
      group: ecr-images-develop
      cancel-in-progress: false
    env:
      AWS_REGION: eu-north-1
      AWS_ACCOUNT_ID: '132415609490'
      ECR_REGISTRY: 132415609490.dkr.ecr.eu-north-1.amazonaws.com
      AWS_PAGER: ''
    steps:
      # Set this repository variable to the verified ARN of safeops-ci-role
      # (planned in docs/iam-permissions-matrix.md). Its ECR scope must cover pfs-*.
      # AWS setup (not performed by this workflow):
      # - IAM OIDC provider https://token.actions.githubusercontent.com,
      #   audience sts.amazonaws.com, in account 132415609490.
      # - Trust action sts:AssumeRoleWithWebIdentity, federated principal
      #   arn:aws:iam::132415609490:oidc-provider/token.actions.githubusercontent.com.
      # - StringEquals token.actions.githubusercontent.com:aud = sts.amazonaws.com
      #   and token.actions.githubusercontent.com:sub =
      #   repo:laamri@122491199/grc-devsecops-pfs@1447407909:ref:refs/heads/develop
      #   (immutable subject prefix verified through GitHub's OIDC settings API;
      #   no GitHub environment is used by this job).
      # - ecr:GetAuthorizationToken on resource "*".
      # - ecr:DescribeRepositories, ecr:DescribeImages, ecr:BatchGetImage,
      #   ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability,
      #   ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload,
      #   ecr:PutImage on these two resources only:
      #   arn:aws:ecr:eu-north-1:132415609490:repository/pfs-backend
      #   arn:aws:ecr:eu-north-1:132415609490:repository/pfs-frontend
      - name: Require the publication role configuration
        env:
          ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
        run: |
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::132415609490:role/.+ ]]; then
            echo '::error::Configure repository variable AWS_ECR_PUBLISH_ROLE_ARN with the ECR publisher role ARN in account 132415609490.'
            exit 1
          fi

      - name: Obtain temporary AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '132415609490'
          role-session-name: github-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: '132415609490'

      - name: Download the images built by the quality-gated job
        uses: actions/download-artifact@v4
        with:
          name: ci-images-${{ github.run_id }}

      - name: Publish missing tags and verify both remote digests
        shell: bash
        run: |
          set -euo pipefail
          docker load -i images.tar
          tag="sha-${GITHUB_SHA:0:12}"
          rows=$(mktemp)
          trap 'rm -f "$rows"' EXIT

          # Only a missing image is a cache miss; IAM/network/other errors fail closed.
          remote_digest() {
            local repo="$1" output error_file
            error_file=$(mktemp)
            if output=$(aws ecr describe-images --registry-id "$AWS_ACCOUNT_ID" \
              --repository-name "$repo" --image-ids "imageTag=$tag" \
              --query 'imageDetails[0].imageDigest' --output text 2>"$error_file"); then
              rm -f "$error_file"
              [[ "$output" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
              printf '%s' "$output"
            elif grep -q 'ImageNotFoundException' "$error_file"; then
              rm -f "$error_file"
              printf ''
            else
              cat "$error_file" >&2
              rm -f "$error_file"
              return 1
            fi
          }

          for repo in pfs-backend pfs-frontend; do
            mutability=$(aws ecr describe-repositories --registry-id "$AWS_ACCOUNT_ID" \
              --repository-names "$repo" --query 'repositories[0].imageTagMutability' --output text)
            [[ "$mutability" == IMMUTABLE ]] || { echo "::error::$repo must be IMMUTABLE"; exit 1; }
            digest=$(remote_digest "$repo")
            if [[ -z "$digest" ]]; then
              local_revision=$(docker image inspect --format \
                '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$repo:ci")
              [[ "$local_revision" == "$GITHUB_SHA" ]] || { echo '::error::Local image revision mismatch'; exit 1; }
              docker tag "$repo:ci" "$ECR_REGISTRY/$repo:$tag"
              if ! docker push "$ECR_REGISTRY/$repo:$tag"; then
                # Another publisher may have claimed the immutable tag meanwhile.
                # Accept only a remotely available image with the exact full revision.
                digest=$(remote_digest "$repo")
                [[ -n "$digest" ]] || { echo "::error::Push failed for $repo"; exit 1; }
              fi
            else
              echo "Reusing existing immutable tag $repo:$tag"
            fi

            # Re-read ECR after each push/reuse, then inspect the remote artifact,
            # not the rebuild (Next.js output need not be reproducible byte-for-byte).
            digest=$(remote_digest "$repo")
            [[ -n "$digest" ]] || { echo "::error::Missing remote digest for $repo"; exit 1; }
            docker pull "$ECR_REGISTRY/$repo@$digest"
            remote_revision=$(docker image inspect --format \
              '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ECR_REGISTRY/$repo@$digest")
            [[ "$remote_revision" == "$GITHUB_SHA" ]] || { echo "::error::Immutable tag collision for $repo:$tag (full SHA differs)"; exit 1; }
            printf '| `%s` | `%s` | `%s` |\n' "$repo" "$tag" "$digest" >> "$rows"
          done

          {
            printf '## ECR publication\n\nCommit: `%s`\n\n' "$GITHUB_SHA"
            printf '| Repository | Tag | Verified ECR digest |\n|---|---|---|\n'
            cat "$rows"
          } >> "$GITHUB_STEP_SUMMARY"
